[project]
name = "oai-agents-example"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "openai-agents>=0.14.2,<0.15",
    "rich>=13.1.0,<15",
    "python-dotenv>=1.0",
    "httpx[socks]>=0.28.1",
]

[dependency-groups]
dev = [
    "ruff>=0.8.0",
    "pyright>=1.1.390",
    "pytest>=9.1.1",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "pre-commit>=4.6.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",                              # pycodestyle errors
    "W",                              # pycodestyle warnings
    "F",                              # pyflakes
    "I",                              # isort(导入排序)
    "N",                              # pep8-naming
    "UP",                             # pyupgrade(自动用新语法)
    "B",                              # flake8-bugbear(常见 bug 模式)
    "C4",                             # flake8-comprehensions
    "SIM",                            # flake8-simplify
    "ASYNC",# flake8-async(异步陷阱,你用得上)
    "S",                              # flake8-bandit(安全检查,替代单独的 bandit)
    "RUF",                            # Ruff 专有规则
]
ignore = [
    "E501",                           # 行长交给 formatter 管
    "B008",                           # FastAPI 的 Depends() 默认参数是惯例,放行
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]             # 测试里允许 assert

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"        # async def test_* 自动识别,无需逐个标记
addopts = [
    "--strict-markers",
    "--cov=comet_project",
    "--cov-report=term-missing",
    "--cov-report=xml",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
